# Shared by every workspace member. Members carry no own file.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .agents/**
    # Patrol regenerates these on every run; a stale copy imports deleted journeys.
    - "**/test_bundle.dart"
    # Generated code is committed (ADR-0020) but not ours to lint.
    - "**/*.graphql.dart"
    - "**/*.g.dart"
