name: web_checkout
description: Web-first bag checkout app.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  api:
    path: ../../packages/api
  auth:
    path: ../../modules/auth
  catalog:
    path: ../../modules/catalog
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  material_ui: ^1.11.0
  storage:
    path: ../../packages/storage
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  patrol: ^4.11.0
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true

patrol:
  app_name: Bag Checkout
  android:
    package_name: dev.mugikhan.bagcheckout
  ios:
    bundle_id: dev.mugikhan.bagcheckout
