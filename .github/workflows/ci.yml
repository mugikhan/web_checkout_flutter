name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 7.8.2

      - name: Resolve workspace
        run: flutter pub get

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
