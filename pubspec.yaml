name: web_checkout_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/web_checkout

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.8.2

melos:
  scripts:
    analyze:
      description: Analyze every Flutter member.
      exec: flutter analyze --no-pub
      packageFilters:
        flutter: true

    format:check:
      description: Fail when a source, test or patrol test file needs formatting.
      steps:
        - format:check:lib
        - format:check:test
        - format:check:patrol_test
    # Check source folders and *_test.dart journeys, so patrol's generated test_bundle.dart stays out.
    format:check:lib:
      private: true
      exec: dart format --output=none --set-exit-if-changed lib
      packageFilters:
        dirExists: lib
    format:check:test:
      private: true
      exec: dart format --output=none --set-exit-if-changed test
      packageFilters:
        dirExists: test
    format:check:patrol_test:
      private: true
      exec: dart format --output=none --set-exit-if-changed patrol_test/*_test.dart
      packageFilters:
        dirExists: patrol_test

    test:
      description: Run unit and widget tests in every Flutter member with a test directory.
      exec: flutter test --no-pub
      packageFilters:
        flutter: true
        dirExists: test
