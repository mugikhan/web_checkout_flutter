name: web_checkout_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/web_checkout

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.8.2

melos:
  scripts:
    analyze:
      description: Analyze every workspace member.
      exec: flutter analyze --no-pub
    format:check:
      description: Fail when any tracked Dart file needs formatting.
      # Check tracked files only, so generated test bundles never fail the check.
      # Skip vendored agent skills; a reinstall overwrites them.
      run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' ':!:.agents/**')
    test:
      description: Run unit and widget tests in every member with a test directory.
      exec: flutter test --no-pub
      packageFilters:
        dirExists: test
