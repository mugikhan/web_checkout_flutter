name: web_checkout_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/web_checkout

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.8.2

melos:
  scripts:
    analyze:
      description: Analyze every workspace member.
      exec: flutter analyze --no-pub
    format:check:
      description: Fail when any Dart file needs formatting.
      exec: dart format --output=none --set-exit-if-changed .
    test:
      description: Run unit and widget tests in every member with a test directory.
      exec: flutter test --no-pub
      packageFilters:
        dirExists: test
