name: web_checkout_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/web_checkout
  - packages/ui

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.8.2

melos:
  scripts:
    # Filters sit on melos exec, not in packageFilters, which prompts for a package.
    analyze:
      description: Analyze every Flutter member.
      run: melos exec --flutter -- flutter analyze --no-pub

    format:check:
      description: Fail when a source, test or patrol test file needs formatting.
      steps:
        - format:check:lib
        - format:check:test
        - format:check:patrol_test
    # Check source folders and *_test.dart journeys, so patrol's generated test_bundle.dart stays out.
    format:check:lib:
      private: true
      run: melos exec --dir-exists=lib -- dart format --output=none --set-exit-if-changed lib
    format:check:test:
      private: true
      run: melos exec --dir-exists=test -- dart format --output=none --set-exit-if-changed test
    format:check:patrol_test:
      private: true
      run: melos exec --dir-exists=patrol_test -- "dart format --output=none --set-exit-if-changed patrol_test/*_test.dart"

    test:
      description: Run unit and widget tests in every Flutter member with a test directory.
      run: melos exec --flutter --dir-exists=test -- flutter test --no-pub
